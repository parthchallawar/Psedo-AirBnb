# Local production-like stack: Nginx load-balancing three app instances.
# Start: docker compose up --build -d      Stop: docker compose down

x-app: &app                      # shared settings for app1..app3
  build: .
  env_file: .env
  restart: unless-stopped
  depends_on:
    - redis
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 40s

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379" # localhost only: lets scripts on this machine inspect the queue (D10)

  notification:
    build: ./notification-service
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379
      FAIL_RATE: ${FAIL_RATE:-0} # e.g. FAIL_RATE=0.7 docker compose up -d notification


  app1:
    <<: *app
    environment:
      INSTANCE_ID: app1
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      MESSAGE_STORE: ${MESSAGE_STORE:-mongo}
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_DC: datacenter1

  app2:
    <<: *app
    environment:
      INSTANCE_ID: app2
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      MESSAGE_STORE: ${MESSAGE_STORE:-mongo}
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_DC: datacenter1

  app3:
    <<: *app
    environment:
      INSTANCE_ID: app3
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      MESSAGE_STORE: ${MESSAGE_STORE:-mongo}
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_DC: datacenter1

  cassandra:
    image: cassandra:4.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9042:9042"
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - cassandra_data:/var/lib/cassandra

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:              # started, not healthy — one slow instance
      - app1                 # must not block Nginx from starting at all
      - app2
      - app3

volumes:
  cassandra_data:

