events {}

http {
  # The three app instances. No algorithm named = round robin.
  upstream wanderlust_app {
    server app1:8080 max_fails=3 fail_timeout=10s;
    server app2:8080 max_fails=3 fail_timeout=10s;
    server app3:8080 max_fails=3 fail_timeout=10s;
  }

  server {
    listen 80;
    client_max_body_size 10m;          # cover photo + up to 5 gallery images

    # Socket.IO chat: WebSocket-only client (see public/js/chat.js), so each
    # connection is a single long-lived stream that naturally stays on one
    # instance — plain round robin works, no sticky sessions/ip_hash needed.
    location /socket.io/ {
      proxy_pass http://wanderlust_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;   # WebSocket handshake
      proxy_set_header Connection "upgrade";
      proxy_set_header Host       $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 60s;   # Socket.IO pings every 25s, so the connection is never idle this long
    }

    location / {
      proxy_pass http://wanderlust_app;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # If an instance is down or broken, retry the request on the next one.
      # POST/PUT/DELETE are only retried if they never reached an instance,
      # so a half-processed booking is never sent twice.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 2s;
    }
  }
}
